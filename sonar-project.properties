# SonarCloud project configuration.
#
# Read by the CI-based scanner in .github/workflows/sonarcloud.yaml. That workflow exists
# because SonarCloud's Automatic Analysis — the GitHub App mode this project used previously —
# cannot import coverage reports at all, so any coverage-based quality gate condition
# evaluates to 0.0% regardless of what the code actually contains.
#
# The two modes are mutually exclusive. Automatic Analysis must stay DISABLED (SonarCloud →
# Administration → Analysis Method); re-enabling it both breaks the scanner ("You are running
# CI analysis while Automatic Analysis is enabled") and takes coverage back to 0.0%.
sonar.projectKey=ptarmiganlabs_butler-sheet-icons
sonar.organization=ptarmiganlabs

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.js,**/*.test.js

# Generated by `npm run test:unit` (jest.config.mjs sets collectCoverage; the lcov reporter is
# a Jest default). Integration tests are deliberately not part of that run — they need a live
# Qlik Sense environment and credentials, so they cannot produce coverage in this workflow.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from analysis: build output, generated files, docs, and the coverage report itself.
# src/lib/util/import-meta-url.js is a generated SEA shim and is excluded from ESLint too
# (see the `ignores` entry in eslint.config.js) — keep the two lists in agreement.
sonar.exclusions=coverage/**,docs/**,node_modules/**,build/**,src/lib/util/import-meta-url.js
