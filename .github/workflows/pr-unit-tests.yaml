name: pr-unit-tests

# Lint and unit tests on every platform the project ships binaries for, before merge.
#
# Until this existed, unit tests ran on pull requests only via sonarcloud.yaml, on ubuntu-latest.
# insiders-build is the only workflow that runs them on Windows and it fires *after* merge, so a
# Windows-only test bug could not be caught until it was already on main. That happened twice in
# quick succession - #839 assumed a non-Windows host, #847 assumed a forward-slash path separator -
# and each cost a red main plus a wasted insiders cycle.
#
# GitHub-hosted runners only, so pull requests from forks never reach the self-hosted machines.
# This workflow reads no secrets at all, which is what makes it safe to run for any contributor:
# a job-level secret would be in the environment of the test run, and the test run executes code
# from the pull request.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: lint + unit tests (${{ matrix.os }})
    strategy:
      # Report every platform rather than cancelling the siblings on first failure - a Windows
      # failure should not hide a Linux one, and vice versa.
      fail-fast: false
      matrix:
        # macos-15, pinned like the release job's runner, because the macOS binary is arm64 only.
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # The jest scripts no longer pass --forceExit (issue #951), so a unit suite that genuinely
    # leaks a handle now hangs instead of exiting. This workflow runs on every pull request, which
    # makes it the likeliest place a newly introduced leak shows up first. Every leg is hosted, so
    # the cost of an untimed hang is billed minutes rather than a blocked runner - but 6 hours of
    # them, per leg, with no signal. 15 minutes against a job that measures 2-4.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      # Safe to run on Windows: .gitattributes pins `* text eol=lf`, so the checkout has Unix
      # line endings on every platform and prettier's default endOfLine: lf matches.
      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      # The macOS binary, signed as the release signs it short of the identity: ad hoc, with the
      # release's identifier, the hardened runtime and release-config's entitlements. An entitlement
      # short of what V8 needs makes it die at start, and so does anything the bundle cannot carry;
      # either fails here, before merge, rather than in a signed release that nothing ran. No secret
      # is involved.
      - name: Build the macOS binary, and sign it ad hoc as the release does
        if: matrix.os == 'macos-15'
        run: |
          npm run build:macos
          codesign --force -s - --identifier com.ptarmiganlabs.butler-sheet-icons --options=runtime \
            --entitlements release-config/butler-sheet-icons.entitlements build/butler-sheet-icons

      - name: Test the macOS binary
        if: matrix.os == 'macos-15'
        run: npm run test:binary
        env:
          BSI_BINARY: build/butler-sheet-icons
          REQUIRE_BINARY: '1'

      # The signature strip in scripts/lib/win-signing.ps1 is PowerShell, so jest never sees it, and
      # every Windows build depends on it: postject rewrites the binary, so the signature node.exe
      # arrives with has to come off first. Windows only, since signtool is Windows only.
      - name: Check the signature strip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/diag/win-strip-check.ps1

      # Again under Windows PowerShell 5.1, because butler-sheet-icons-premium dot-sources the same
      # library under 5.1. This leg is what stops a PowerShell 7-only construct reaching it: it would
      # pass every job here and then fail the premium build.
      - name: Check the signature strip under Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./scripts/diag/win-strip-check.ps1
