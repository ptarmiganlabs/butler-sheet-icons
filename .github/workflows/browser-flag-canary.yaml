name: browser-flag-canary

# On-demand A/B test of the `--single-process` Chromium flag on macOS.
#
# ---------------------------------------------------------------------------------------------
# Why this exists, and why it is still here after the issue was closed
# ---------------------------------------------------------------------------------------------
#
# Issue #913 reported that `--single-process` made every screenshot hang on macOS until
# puppeteer's 180 s protocol timeout, failing 100% of apps in a run. It was real and it was
# isolated: bare puppeteer, `about:blank`, no BSI code, same machine and same Chrome build minutes
# apart - with the flag it never completed, without it, 31 ms.
#
# What was never established is *what state* triggers it. The failure was only ever observed on one
# laptop, and this workflow was built to reproduce it somewhere measurable. It did not:
#
#   - Forcing the display asleep on the build Mac (2026-08-09): no difference.
#   - A genuinely unattended overnight sample - `userIsActive=0`, display asleep 3 h 13 min
#     (2026-08-10): no difference. `--single-process` was the *fastest* of the three trials.
#
# So the display-sleep / idle-session hypothesis is disconfirmed on the one machine that can be
# instrumented, and #913 was closed as "not planned" with the trigger unidentified. `--single-process`
# is still in `buildBrowserArgs` and still added on every non-Windows, non-Docker launch.
#
# This is kept, rather than deleted with the issue, because the flag is still in the product and the
# failure was never explained. If it recurs, this and `scripts/diag/browser-flag-probe.mjs` are the
# instruments - already written, already exercised - and running one is far cheaper than rebuilding
# them under pressure. Most valuably, the probe runs `sample(1)` against the wedged browser process
# on a hang and keeps the stack, which is the one piece of evidence the whole investigation never
# managed to obtain.
#
# ---------------------------------------------------------------------------------------------
# Running it
# ---------------------------------------------------------------------------------------------
#
# Manual only. Nothing here touches product code or any Qlik environment.
#
# Only the hosted control runs here now. The probe that mattered ran on the self-hosted build Mac,
# and this repository is public: no self-hosted runner group admits a public repository
# (plabs-house-rules, rules/ci/public-repositories.md), so that job could never start again and was
# removed in October 2026. When a macOS host is suspected of the #913 symptom - every app in a run
# failing with `Page.captureScreenshot timed out` - run the probe on that machine, in the state it
# shows the symptom in:
#
#   node scripts/diag/browser-flag-probe.mjs --label as-is --timeout 20000 --artifact-dir ./flag-probe
#
# or from a workflow in the private butler-sheet-icons-e2e repository, which can use the build Mac.
# The display-sleep and session-suspend steps the removed job used are in this file's history.
#
# Reading the result:
#
#   - A job goes red **only** when screenshots fail *without* the flag. Reproducing the failure
#     *with* the flag is the finding, and is reported rather than failed: a canary that goes red for
#     its own findings gets ignored.
#   - "No difference observed in this state" means the machine was not in the failing state - not
#     that the flag is fine. Absence of the symptom proves nothing on its own.
#
# The context CI cannot give you: `test-browser-macos` takes no screenshot at all,
# `test-qscloud-macos` runs on a hosted runner with no display to fall asleep, and the QSEoW tests
# in butler-sheet-icons-e2e run on the build Mac only while it is in use. None of them would ever
# have caught this.

on:
  workflow_dispatch:
    inputs:
      browser_version:
        description: 'Browser version to probe, e.g. recommended, stable, or a build id'
        required: false
        default: 'recommended'

# There was a nightly schedule here while #913 was open, to catch the build Mac in its unattended
# overnight state without anyone having to force it. It ran, produced the clean negative result
# recorded above, and was removed with the issue.

permissions: {}

concurrency:
  group: browser-flag-canary
  cancel-in-progress: false

jobs:
  # Control. A hosted runner has no display to put to sleep and no persistent session, so this leg
  # is expected to stay green throughout - which is what makes it worth having. If it ever goes
  # red, the trigger is not the one we think it is.
  probe-hosted:
    permissions:
      contents: read
    runs-on: macos-15
    # Measured under a minute; 15 leaves room for a cold npm cache without letting a hang sit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run the A/B probe
        env:
          PROBE_BROWSER_VERSION: ${{ inputs.browser_version || 'recommended' }}
        run: |
          node scripts/diag/browser-flag-probe.mjs \
            --label hosted-control \
            --timeout 20000 \
            --browser-version "$PROBE_BROWSER_VERSION" \
            --artifact-dir "$RUNNER_TEMP/flag-probe"

      - name: Upload stack samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flag-probe-hosted-${{ github.run_id }}
          path: ${{ runner.temp }}/flag-probe/
          if-no-files-found: ignore
          retention-days: 14
