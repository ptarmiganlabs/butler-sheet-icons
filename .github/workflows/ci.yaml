      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          pwd 
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: bash ./scripts/release-macos.sh

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          # artifactContentType: application/zip
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-macos-arm64.zip
          token: ${{ github.token }}

      - name: Tidy up before exiting
        run: |
          pwd
          ls -la

  release-win64:
    needs: release-please
    runs-on:
      - self-hosted
      - x64
      - windows
      - sp53
      - win-code-sign
    # Not optional. A lapsed SimplySign session can leave signtool waiting on a graphical prompt
    # that nothing on a runner will answer; the scripts kill signtool themselves, and this is the
    # backstop if anything else wedges. Without it the default is six hours.
    timeout-minutes: 30
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    env:
      DIST_FILE_NAME: butler-sheet-icons
      GITHUB_TOKEN: ${{ secrets.PAT }}
      # The certificate is a Certum cloud certificate, reached through SimplySign Desktop on the
      # win-code-sign runner. It only exists in that machine's certificate store while a SimplySign
      # session is open, and a session lasts about two hours - so somebody has to log in to
      # SimplySign Desktop before merging a release-please PR.
      #
      # Forgetting is not a disaster: the preflight step below fails this job in seconds, and
      # re-running it after logging in is all that is needed. See scripts/lib/win-signing.ps1.
      CODESIGN_WIN_THUMBPRINT: ${{ secrets.WIN_CODESIGN_THUMBPRINT }}
    steps:
      - name: Release tag and upload url from previous job
        shell: powershell
        run: |
          Write-Output 'tag_name        : ${{ needs.release-please.outputs.release_tag_name }}'
          Write-Output 'upload_url      : ${{ needs.release-please.outputs.release_upload_url }}'

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. Without `ref`, checkout takes `github.sha` - the commit that triggered
          # this run - and release-please cuts the release from main's HEAD, which is a
          # different commit whenever an unrelated push is what started the run. On 2026-08-10
          # that shipped all three 4.1.0 binaries built from the commit before the version bump,
          # so they reported "App version: 4.0.0": the SEA build embeds package.json as an asset
          # and globals.js reads the version straight out of it.
          #
          # The sha rather than the tag, because release-please is configured to cut a *draft*
          # release and a draft has no tag ref - GitHub creates it at publication. Checking out
          # the tag name failed all four release jobs on 5.0.0. Issue #1145.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      # Fail before spending ten minutes on a build that cannot be signed.
      #
      # The Certum certificate is only in this machine's store while a SimplySign session is open,
      # and a session lasts about two hours - so "no certificate" is a routine state, not an exotic
      # one. Checking here means the answer arrives in seconds and the fix is to log in to
      # SimplySign Desktop on the runner and re-run this job.
      #
      # -ProveSigning actually signs a few-kilobyte scratch file rather than trusting the
      # certificate store. That is not belt and braces: SimplySign leaves certificates registered
      # after a session ends, so a store lookup would pass with an expired session and this step
      # would wave through a build that cannot possibly be signed - which is the whole thing it
      # exists to prevent.
      #
      # Written for `shell: powershell` for the same reason as the version check below - it is the
      # shell this self-hosted runner is known to have. In fact it is the *only* one: the runner has
      # no PowerShell 7 at all, so a `run:` step that names no shell resolves to Windows PowerShell
      # too. Every signing script therefore has to work under 5.1, this one no more than the rest.
      - name: Preflight the Windows signing certificate
        shell: powershell
        run: ./scripts/diag/win-signing-check.ps1 -RequireSigning -ProveSigning

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      # Same check as the other release jobs, written in powershell because that is the shell
      # this self-hosted runner is known to have - every other run step in this job uses it,
      # while bash would depend on Git for Windows being on PATH. A guard that fails spuriously
      # would block a release, which is worse than the defect it guards against.
      - name: Verify the checkout is the version being released
        shell: powershell
        run: |
          $expected = "${{ needs.release-please.outputs.release_version }}"
          $actual = node -p "require('./package.json').version"
          Write-Host "release-please version : $expected"
          Write-Host "package.json version   : $actual"
          if ($actual -ne $expected) {
            Write-Host "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          }

      - name: Install dependencies
        shell: powershell
        run: |
          pwd
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: ./scripts/release-win.ps1

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-win.zip
          token: ${{ github.token }}

      - name: Tidy up before existing
        shell: powershell
        run: |
          dir

