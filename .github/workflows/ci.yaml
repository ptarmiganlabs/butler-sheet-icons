  release-please:
    # The tail of each back-end chain, plus both browser jobs - together these transitively
    # require every test and build job, so nothing is released that has not been exercised.
    needs:
      - test-browser-macos
      - test-browser-win
      - docker-qscloud-amd64
      - docker-qseow-amd64
    # release-please targets main, so it must not run for a workflow_dispatch fired from a
    # feature branch. Skipping it here also skips every release-* job, since they gate on its
    # releases_created output - which is what makes the pipeline safe to dry-run from a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_tag_name: ${{ steps.release.outputs['tag_name'] }}
      release_version: ${{ steps.release.outputs['version'] }}
      release_upload_url: ${{ steps.release.outputs['upload_url'] }}
    env:
      GITHUB_REF: ${{ github.ref }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Show github.ref
        run: echo "$GITHUB_REF"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: |
          github.repository_owner == 'ptarmiganlabs'
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          # optional. customize path to release-please-config.json
          config-file: release-please-config.json
          # optional. customize path to .release-please-manifest.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Show output from Release-Please
        if: always()
        env:
          RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: echo "$RELEASE_PLEASE_OUTPUT"

      - name: Show output from Release-Please
        # if: ${{ steps.release.outputs.releases_created }}
        run: |
          echo "releases_created: ${{ steps.release.outputs.releases_created }}"
          echo "release_created : ${{ steps.release.outputs.release_created }}"
          echo "draft           : ${{ steps.release.outputs['draft'] }}"
          echo "path            : ${{ steps.release.outputs['path'] }}"
          echo "upload_url      : ${{ steps.release.outputs['upload_url'] }}"
          echo "html_url        : ${{ steps.release.outputs['html_url'] }}"
          echo "tag_name        : ${{ steps.release.outputs['tag_name'] }}"
          echo "version         : ${{ steps.release.outputs['version'] }}"
          echo "major           : ${{ steps.release.outputs['major'] }}"
          echo "minor           : ${{ steps.release.outputs['minor'] }}"
          echo "patch           : ${{ steps.release.outputs['patch'] }}"
          echo "sha             : ${{ steps.release.outputs['sha'] }}"

  sbom-build:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this, the default checkout is `github.sha` - the commit that happened to
          # trigger this run, which is not the commit release-please just tagged. See the note
          # on the same step in release-macos-arm64 for what that shipped.
          ref: ${{ needs.release-please.outputs.release_tag_name }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          npm ci --include=dev --include=prod

      - name: Generate SBOM
        run: |
          curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool
          mkdir -p ./build/sbom

          $RUNNER_TEMP/sbom-tool generate -b ./build/sbom -bc . -pn ${DIST_FILE_NAME} -pv ${{ needs.release-please.outputs.release_version }} -ps "Ptarmigan Labs" -nsb https://sbom.ptarmiganlabs.com -V verbose

      - name: Upload SBOM to Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: './build/sbom/**/*.spdx.json'
          token: ${{ github.token }}

      - name: Upload SBOM as Workflow Artifact (backup)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ needs.release-please.outputs.release_version }}
          path: ./build/sbom/
          retention-days: 3

  release-macos-arm64:
    needs: release-please
    # scripts/release-macos.sh builds its own ephemeral keychain from MACOS_CERTIFICATE and
    # notarizes via xcrun notarytool, so signing needs no on-premise state. Pinned rather than
    # macos-latest because the artifact must be arm64.
    runs-on: macos-15
    # timeout-minutes: 15
    permissions:
      contents: write

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sheet-icons
      GITHUB_TOKEN: ${{ secrets.PAT }}
      MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
      MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
      PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
      PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
      PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
    steps:
      - name: Release tag and upload url from previous job
        run: |
          echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
          echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. Without `ref`, checkout takes `github.sha` - the commit that triggered
          # this run - and release-please cuts the release from main's HEAD, which is a
          # different commit whenever an unrelated push is what started the run. On 2026-08-10
          # that shipped all three 4.1.0 binaries built from the commit before the version bump,
          # so they reported "App version: 4.0.0": the SEA build embeds package.json as an asset
          # and globals.js reads the version straight out of it.
          ref: ${{ needs.release-please.outputs.release_tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          pwd 
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: bash ./scripts/release-macos.sh

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          # artifactContentType: application/zip
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-macos-arm64.zip
          token: ${{ github.token }}

      - name: Tidy up before exiting
        run: |
          pwd
          ls -la

  release-win64:
    needs: release-please
    runs-on:
      - self-hosted
      - x64
      - windows
      - sp53
      - win-code-sign
    # timeout-minutes: 15
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    env:
      DIST_FILE_NAME: butler-sheet-icons
      GITHUB_TOKEN: ${{ secrets.PAT }}
      # Windows code signing is OFF: the certificate expired, and signtool cannot sign with it
      # whatever else is configured. scripts/release-win.ps1 skips signing when this variable is
      # empty and ships an unsigned binary instead of failing, which is why 4.0.0 went out with no
      # Windows binary at all.
      #
      # TO RE-ENABLE: uncomment the line below, once WIN_CODESIGN_THUMBPRINT holds the thumbprint
      # of a valid certificate. Nothing else needs changing here. Note that Certum SimplySign is a
      # cloud signing service, so the signtool invocation in release-win.ps1 will probably need
      # reworking for it rather than simply being switched back on - see the comment there.
      # CODESIGN_WIN_THUMBPRINT: ${{ secrets.WIN_CODESIGN_THUMBPRINT}}
    steps:
      - name: Release tag and upload url from previous job
        shell: powershell
        run: |
          Write-Output 'tag_name        : ${{ needs.release-please.outputs.release_tag_name }}'
          Write-Output 'upload_url      : ${{ needs.release-please.outputs.release_upload_url }}'

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. Without `ref`, checkout takes `github.sha` - the commit that triggered
          # this run - and release-please cuts the release from main's HEAD, which is a
          # different commit whenever an unrelated push is what started the run. On 2026-08-10
          # that shipped all three 4.1.0 binaries built from the commit before the version bump,
          # so they reported "App version: 4.0.0": the SEA build embeds package.json as an asset
          # and globals.js reads the version straight out of it.
          ref: ${{ needs.release-please.outputs.release_tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      # Same check as the other release jobs, written in powershell because that is the shell
      # this self-hosted runner is known to have - every other run step in this job uses it,
      # while bash would depend on Git for Windows being on PATH. A guard that fails spuriously
      # would block a release, which is worse than the defect it guards against.
      - name: Verify the checkout is the version being released
        shell: powershell
        run: |
          $expected = "${{ needs.release-please.outputs.release_version }}"
          $actual = node -p "require('./package.json').version"
          Write-Host "release-please version : $expected"
          Write-Host "package.json version   : $actual"
          if ($actual -ne $expected) {
            Write-Host "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          }

      - name: Install dependencies
        shell: powershell
        run: |
          pwd
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: ./scripts/release-win.ps1

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-win.zip
          token: ${{ github.token }}

      - name: Tidy up before existing
        shell: powershell
        run: |
          dir

