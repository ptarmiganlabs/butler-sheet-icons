name: ci

on:
  workflow_dispatch:
    inputs:
      # Proves Azure signing works without cutting a release: see build-win64. Dispatch it on main.
      # sign-win64 runs in the release-signing environment, which admits only main, so a rehearsal
      # dispatched on any other branch is refused at that job.
      #
      #   gh workflow run ci.yaml -R ptarmiganlabs/butler-sheet-icons --ref main -f rehearse_signing=true
      rehearse_signing:
        description: Build and sign the Windows binary from this commit, and release nothing
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  unit-tests:
    # A signing rehearsal tests nothing and releases nothing: skipping this job skips every job
    # that needs it, and with them release-please. What is left is build-win64 and sign-win64.
    if: ${{ !inputs.rehearse_signing }}
    permissions:
      contents: read
    # Same reason as the integration jobs below, and it matters more here: every one of them
    # declares `needs: unit-tests`, so an untimed hang in the unit suite would stall the whole
    # workflow for 6 hours and their own timeouts would never get to fire.
    # 15 minutes against a job that measures about 2.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------------------------
  # Browser suites - no Qlik back end at all.
  #
  # The five browser integration tests read only BSI_LOG_LEVEL and BSI_TEST_TIMEOUT, so these jobs
  # carry no concurrency group and no ordering constraint. Both halves run on hosted runners; the
  # Windows half is there for Windows platform coverage.
  # ---------------------------------------------------------------------------------------------
  test-browser-macos:
    needs:
      - unit-tests
    permissions:
      contents: read
    # The jest scripts no longer pass --forceExit (issue #951), so a suite that genuinely leaks a
    # handle now hangs instead of exiting - which is the point, it makes the leak visible. Without
    # an explicit timeout that hang would run to GitHub's 6-hour default, holding any concurrency
    # group the job is in for that whole time. 30 minutes is roughly 3x the slowest of these suites
    # (measured: 1.8-10.3 min).
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run browser tests
        run: npm run test:integration:browser
        env:
          BSI_LOG_LEVEL: 'info'
          # A repository variable, not a secret, like BSI_INCLUDE_SHEET_PART in the QS Cloud jobs.
          # Neither is confidential, and a secret holding a short number masks that number wherever
          # it appears in the job's log: as secrets, every 1 in a timestamp, a commit hash or an exit
          # code was printed as ***. Unset, the tests use their defaults (20 minutes, sheet part 1).
          BSI_TEST_TIMEOUT: ${{ vars.BSI_TEST_TIMEOUT }}

  test-browser-win:
    needs:
      - unit-tests
    permissions:
      contents: read
    # See the note on test-browser-macos: bounds a hung suite now that --forceExit is gone.
    timeout-minutes: 30
    # GitHub-hosted: this repository is public, and no self-hosted runner group admits a public
    # repository (plabs-house-rules, rules/ci/public-repositories.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --include=dev --include=prod

      - name: Run browser tests
        shell: powershell
        run: npm run test:integration:browser
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ vars.BSI_TEST_TIMEOUT }} # a variable: see test-browser-macos

  # ---------------------------------------------------------------------------------------------
  # QS Cloud chain - every job here talks to the shared Qlik Sense Cloud tenant.
  #
  # None of it needs the on-premise environment, so all four run on hosted runners.
  # ---------------------------------------------------------------------------------------------
  test-qscloud-macos:
    needs:
      - unit-tests
    permissions:
      contents: read
    # See the note on test-browser-macos: bounds a hung suite now that --forceExit is gone.
    timeout-minutes: 30
    # One run at a time against the shared tenant, across runs. queue: max lets the jobs that are
    # waiting line up, up to 100, and start in turn. Without it a group holds one waiting job, and a
    # third arrival cancels the one already waiting ("Canceling since a higher priority waiting
    # request ... exists"). On 2026-10-18 that cancelled a merge's test-qscloud-macos after it had
    # waited almost an hour, and skipped every job after it. queue: max needs cancel-in-progress
    # false.
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    # The tenant credentials live in the qscloud-tests environment, which admits only main, so a
    # workflow_dispatch from any other branch cannot reach them (plabs-house-rules,
    # rules/ci/public-repositories.md). BSI_CLOUD_TENANT_URL may hold the bare host or a pasted
    # URL: the tests reduce it to the host the way --tenanturl does (getCloudTenantHost).
    environment: qscloud-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run QS cloud tests
        run: npm run test:integration:cloud
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ vars.BSI_TEST_TIMEOUT }} # a variable: see test-browser-macos
          BSI_INCLUDE_SHEET_PART: ${{ vars.BSI_INCLUDE_SHEET_PART }}
          BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
          BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
          BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
          BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
          BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
          BSI_CLOUD_COLLECTION_ID: ${{ secrets.BSI_CLOUD_COLLECTION_ID }}

  test-qscloud-win:
    # Chained rather than parallel: this is what keeps only one job at a time against the tenant
    # *within* a run. The concurrency group guards against other runs.
    needs:
      - test-qscloud-macos
    permissions:
      contents: read
    # See the note on test-browser-macos: bounds a hung suite now that --forceExit is gone.
    timeout-minutes: 30
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
      queue: max # see test-qscloud-macos
    # Tenant credentials: see test-qscloud-macos.
    environment: qscloud-tests
    # GitHub-hosted: this repository is public, and no self-hosted runner group admits a public
    # repository (plabs-house-rules, rules/ci/public-repositories.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --include=dev --include=prod

      - name: Run QS cloud tests
        shell: powershell
        run: npm run test:integration:cloud
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ vars.BSI_TEST_TIMEOUT }} # a variable: see test-browser-macos
          BSI_INCLUDE_SHEET_PART: ${{ vars.BSI_INCLUDE_SHEET_PART }}
          BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
          BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
          BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
          BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
          BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
          BSI_CLOUD_COLLECTION_ID: ${{ secrets.BSI_CLOUD_COLLECTION_ID }}

  # ---------------------------------------------------------------------------------------------
  # Docker image builds - no Qlik back end, so no group, and they only wait on unit-tests.
  #
  # The image smoke test and the browser-cache commands need no back end either, so they run here
  # where the image is already local, rather than paying an artifact round trip in a later job.
  # ---------------------------------------------------------------------------------------------
  docker-build-arm64:
    name: docker-build-arm64
    needs:
      - unit-tests
    if: github.repository_owner == 'ptarmiganlabs'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    # Builds a linux/arm64 image, so it needs an arm64 host but not the local Qlik Sense
    # environment. A hosted arm64 runner builds natively, rather than going through Docker
    # Desktop on the self-hosted Mac.
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_NAME: butler-sheet-icons:ci-arm64
      IMAGE_TAR: butler-sheet-icons-ci-arm64.tar
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build arm64 Docker image
        run: |
          set -x
          docker build \
            --file src/Dockerfile \
            --tag "$IMAGE_NAME" \
            --platform linux/arm64 \
            --progress=plain \
            . 2>&1 | tee /tmp/docker-build.log || {
              echo "Build failed, showing last 50 lines:"
              tail -50 /tmp/docker-build.log
              exit 1
            }

      - name: Smoke test arm64 image
        run: docker run --rm "$IMAGE_NAME" --version

      - name: Run browser cache commands (arm64 image)
        run: |
          CACHE_DIR="$RUNNER_TEMP/bsi-browser-cache"
          mkdir -p "$CACHE_DIR"
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser list-available
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser uninstall-all

      - name: Save Docker image to tarball
        run: docker save "$IMAGE_NAME" -o "$IMAGE_TAR"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-sheet-icons-ci-arm64-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  docker-build-on-ubuntu-amd64:
    name: docker-build-on-ubuntu-amd64
    needs:
      - unit-tests
    if: github.repository_owner == 'ptarmiganlabs'
    permissions:
      contents: read
      actions: write
    # Image build only - no Qlik Sense access needed, so this does not have to be on-premise.
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: butler-sheet-icons:ci-amd64
      IMAGE_TAR: butler-sheet-icons-ci-amd64.tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build amd64 Docker image
        run: |
          docker build \
            --file src/Dockerfile \
            --tag "$IMAGE_NAME" \
            .

      - name: Smoke test amd64 image
        run: docker run --rm "$IMAGE_NAME" --version

      - name: Run browser cache commands (amd64 image)
        run: |
          CACHE_DIR="$RUNNER_TEMP/bsi-browser-cache"
          mkdir -p "$CACHE_DIR"
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser list-available
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser uninstall-all

      - name: Save Docker image to tarball
        run: docker save "$IMAGE_NAME" -o "$IMAGE_TAR"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-sheet-icons-ci-amd64-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # Docker image exercised against each back end. Split the same way as the test jobs, and for the
  # same reason: a job may carry only one concurrency group.
  # ---------------------------------------------------------------------------------------------
  docker-qscloud-arm64:
    needs:
      - docker-build-arm64
      - test-qscloud-win
    if: github.repository_owner == 'ptarmiganlabs'
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
      queue: max # see test-qscloud-macos
    permissions:
      actions: read
      contents: read
    # Tenant credentials: see test-qscloud-macos.
    environment: qscloud-tests
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_NAME: butler-sheet-icons:ci-arm64
      IMAGE_TAR: butler-sheet-icons-ci-arm64.tar
      BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
      BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
      BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
      BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
      BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: butler-sheet-icons-ci-arm64-image

      - name: Load Docker image
        run: docker load --input "$IMAGE_TAR"

      # Which user the container runs as is decided by who owns the mounted directory (issue #915),
      # so that ownership is the first thing worth knowing when one of these jobs misbehaves. It
      # was not recorded anywhere, which is how #915 came to assert that docker-qseow-amd64 shared
      # the same root cause on the strength of an inference rather than a measurement.
      - name: Report mounted directory ownership
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          echo "runner user : $(id)"
          ls -lnd "$IMG_DIR"

      - name: Run QS Cloud commands (arm64 image)
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          docker run --rm \
            "$IMAGE_NAME" \
            qscloud list-collections \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --outputformat table

          docker run --rm \
            -v "$IMG_DIR:/nodeapp/img" \
            "$IMAGE_NAME" \
            qscloud create-sheet-thumbnails \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --logonuserid "$BSI_CLOUD_LOGON_USERID" \
            --logonpwd "$BSI_CLOUD_LOGON_PWD" \
            --appid "$BSI_CLOUD_APP_ID" \
            --log-level verbose \
            --imagedir ./img

      # No --user flag anywhere above: the image adopting the mount's owner by itself is the fix
      # for issue #915, and this job passing unmodified is what proves it.
      #
      # Checking only that the command succeeded is not enough. It would also pass if the
      # entrypoint had quietly run everything as root, which is the outcome most worth catching -
      # root can write anywhere, and the thumbnails would land on the host owned by root.
      - name: Assert the thumbnails are owned by the runner user
        run: |
          set -euo pipefail
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          EXPECTED_UID=$(id -u)

          if [ -z "$(find "$IMG_DIR" -type f -print -quit)" ]; then
            echo "::error::no files were written to $IMG_DIR"
            exit 1
          fi

          WRONG_OWNER=$(find "$IMG_DIR" -type f ! -uid "$EXPECTED_UID" -print -quit)
          if [ -n "$WRONG_OWNER" ]; then
            echo "::error::files under $IMG_DIR are not owned by uid $EXPECTED_UID"
            find "$IMG_DIR" -type f ! -uid "$EXPECTED_UID" -exec ls -ln {} + | head -5
            exit 1
          fi

          echo "Every file under $IMG_DIR is owned by uid $EXPECTED_UID."

  docker-qscloud-amd64:
    needs:
      - docker-build-on-ubuntu-amd64
      - docker-qscloud-arm64
    if: github.repository_owner == 'ptarmiganlabs'
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
      queue: max # see test-qscloud-macos
    permissions:
      actions: read
      contents: read
    # Tenant credentials: see test-qscloud-macos.
    environment: qscloud-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: butler-sheet-icons:ci-amd64
      IMAGE_TAR: butler-sheet-icons-ci-amd64.tar
      BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
      BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
      BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
      BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
      BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: butler-sheet-icons-ci-amd64-image

      - name: Load Docker image
        run: docker load --input "$IMAGE_TAR"

      # See the same step in docker-qscloud-arm64.
      - name: Report mounted directory ownership
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          echo "runner user : $(id)"
          ls -lnd "$IMG_DIR"

      - name: Run QS Cloud commands (amd64 image)
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          docker run --rm \
            "$IMAGE_NAME" \
            qscloud list-collections \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --outputformat table

          docker run --rm \
            -v "$IMG_DIR:/nodeapp/img" \
            "$IMAGE_NAME" \
            qscloud create-sheet-thumbnails \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --logonuserid "$BSI_CLOUD_LOGON_USERID" \
            --logonpwd "$BSI_CLOUD_LOGON_PWD" \
            --appid "$BSI_CLOUD_APP_ID" \
            --log-level verbose \
            --imagedir ./img

      # See the same step in docker-qscloud-arm64 for why ownership is asserted and not just exit
      # status.
      - name: Assert the thumbnails are owned by the runner user
        run: |
          set -euo pipefail
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          EXPECTED_UID=$(id -u)

          if [ -z "$(find "$IMG_DIR" -type f -print -quit)" ]; then
            echo "::error::no files were written to $IMG_DIR"
            exit 1
          fi

          WRONG_OWNER=$(find "$IMG_DIR" -type f ! -uid "$EXPECTED_UID" -print -quit)
          if [ -n "$WRONG_OWNER" ]; then
            echo "::error::files under $IMG_DIR are not owned by uid $EXPECTED_UID"
            find "$IMG_DIR" -type f ! -uid "$EXPECTED_UID" -exec ls -ln {} + | head -5
            exit 1
          fi

          echo "Every file under $IMG_DIR is owned by uid $EXPECTED_UID."

  release-please:
    # The tail of the QS Cloud chain, plus both browser jobs - together these transitively
    # require every test and build job in this workflow, so nothing is released that has not been
    # exercised here.
    #
    # The QSEoW tests are not in this workflow. They need the homelab Qlik Sense server, which a
    # public repository's GitHub-hosted runners cannot reach, so they run nightly in the private
    # ptarmiganlabs/butler-sheet-icons-e2e. Before merging a release-please PR, run them by hand
    # on its head commit:
    #   gh workflow run qseow-e2e.yaml -R ptarmiganlabs/butler-sheet-icons-e2e -f ref=<sha>
    needs:
      - test-browser-macos
      - test-browser-win
      - docker-qscloud-amd64
    # release-please targets main, so it must not run for a workflow_dispatch fired from a
    # feature branch. Skipping it here also skips every release-* job, since they gate on its
    # releases_created output - which is what makes the pipeline safe to dry-run from a branch.
    #
    # A signing rehearsal must not cut a release either, whichever branch it is dispatched from.
    if: github.ref == 'refs/heads/main' && !inputs.rehearse_signing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_tag_name: ${{ steps.release.outputs['tag_name'] }}
      # The commit release-please released. Unlike the tag, this exists the moment the
      # release object does - a draft release carries a tag *name* but no ref, so the
      # tag cannot be checked out until someone publishes. Issue #1145.
      release_sha: ${{ steps.release.outputs['sha'] }}
      release_version: ${{ steps.release.outputs['version'] }}
      release_upload_url: ${{ steps.release.outputs['upload_url'] }}
    env:
      GITHUB_REF: ${{ github.ref }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Show github.ref
        run: echo "$GITHUB_REF"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: |
          github.repository_owner == 'ptarmiganlabs'
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          # optional. customize path to release-please-config.json
          config-file: release-please-config.json
          # optional. customize path to .release-please-manifest.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Show output from Release-Please
        if: always()
        env:
          RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: echo "$RELEASE_PLEASE_OUTPUT"

      - name: Show output from Release-Please
        # if: ${{ steps.release.outputs.releases_created }}
        run: |
          echo "releases_created: ${{ steps.release.outputs.releases_created }}"
          echo "release_created : ${{ steps.release.outputs.release_created }}"
          echo "draft           : ${{ steps.release.outputs['draft'] }}"
          echo "path            : ${{ steps.release.outputs['path'] }}"
          echo "upload_url      : ${{ steps.release.outputs['upload_url'] }}"
          echo "html_url        : ${{ steps.release.outputs['html_url'] }}"
          echo "tag_name        : ${{ steps.release.outputs['tag_name'] }}"
          echo "version         : ${{ steps.release.outputs['version'] }}"
          echo "major           : ${{ steps.release.outputs['major'] }}"
          echo "minor           : ${{ steps.release.outputs['minor'] }}"
          echo "patch           : ${{ steps.release.outputs['patch'] }}"
          echo "sha             : ${{ steps.release.outputs['sha'] }}"

  sbom-build:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this, the default checkout is `github.sha` - the commit that happened to
          # trigger this run, which is not the commit release-please just released. See the note
          # on the same step in release-macos-arm64 for what that shipped.
          #
          # The sha rather than the tag: the release is a draft, and a draft has no tag ref
          # until it is published. Issue #1145.
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          npm ci --include=dev --include=prod

      - name: Generate SBOM
        run: |
          curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool
          mkdir -p ./build/sbom

          $RUNNER_TEMP/sbom-tool generate -b ./build/sbom -bc . -pn ${DIST_FILE_NAME} -pv ${{ needs.release-please.outputs.release_version }} -ps "Ptarmigan Labs" -nsb https://sbom.ptarmiganlabs.com -V verbose

      - name: Upload SBOM to Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: './build/sbom/**/*.spdx.json'
          token: ${{ github.token }}

      - name: Upload SBOM as Workflow Artifact (backup)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ needs.release-please.outputs.release_version }}
          path: ./build/sbom/
          retention-days: 3

  release-macos-arm64:
    needs: release-please
    # scripts/release-macos.sh builds its own ephemeral keychain from MACOS_CERTIFICATE and
    # notarizes via xcrun notarytool, so signing needs no on-premise state. Pinned rather than
    # macos-latest because the artifact must be arm64.
    runs-on: macos-15
    # In the release-signing environment, which admits main alone, like sign-win64 (and like
    # butler-sos's macOS release). The Apple signing secrets are organisation secrets today,
    # readable by a workflow on any branch. This lets them move into the environment, where only
    # main's macOS jobs can read them; a job that does not name the environment would lose them
    # then.
    environment: release-signing
    # timeout-minutes: 15
    permissions:
      contents: write

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sheet-icons
      GITHUB_TOKEN: ${{ secrets.PAT }}
      MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
      MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
      PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
      PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
      PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
    steps:
      - name: Release tag and upload url from previous job
        run: |
          echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
          echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. Without `ref`, checkout takes `github.sha` - the commit that triggered
          # this run - and release-please cuts the release from main's HEAD, which is a
          # different commit whenever an unrelated push is what started the run. On 2026-08-10
          # that shipped all three 4.1.0 binaries built from the commit before the version bump,
          # so they reported "App version: 4.0.0": the SEA build embeds package.json as an asset
          # and globals.js reads the version straight out of it.
          #
          # The sha rather than the tag, because release-please is configured to cut a *draft*
          # release and a draft has no tag ref - GitHub creates it at publication. Checking out
          # the tag name failed all four release jobs on 5.0.0. Issue #1145.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          pwd 
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: bash ./scripts/release-macos.sh

      # The signed binary, run beside the source before it is attached, so that a hardened runtime
      # or an entitlement that stops it starting fails here rather than in somebody's download. It
      # runs the binary, which carries dependency code, so env -i keeps this job's Apple secrets
      # and token out of its environment: it gets only what npm and node need.
      - name: Test the signed binary
        run: >-
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP"
          BSI_BINARY="./${DIST_FILE_NAME}" REQUIRE_BINARY=1
          npm run test:binary

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          # artifactContentType: application/zip
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-macos-arm64.zip
          token: ${{ github.token }}

      - name: Tidy up before exiting
        run: |
          pwd
          ls -la

  # ---------------------------------------------------------------------------------------------
  # Windows release: build, sign and publish, as three jobs, so that the one holding the signing
  # identity runs no repository code.
  #
  # build-win64 builds the unsigned binary and checks it (scripts/release-win.ps1). sign-win64 signs
  # it through Azure Artifact Signing and verifies the signature; it checks nothing out and runs no
  # npm and no repository scripts, so a compromised dependency cannot reach the OIDC token that
  # unlocks signing. publish-win64 zips the signed binary and attaches it to the release.
  #
  # All three are GitHub-hosted: this repository is public, and no self-hosted runner group admits
  # a public repository (plabs-house-rules, rules/ci/public-repositories.md). butler-sos, magpie-cli
  # and persona sign the same way.
  #
  # A rehearsal (workflow_dispatch with rehearse_signing) runs build-win64 and sign-win64 on the
  # dispatched commit and releases nothing. The signed binary is kept as the win64-signed artifact,
  # for anyone who wants to try it on a real machine.
  # ---------------------------------------------------------------------------------------------
  build-win64:
    needs: release-please
    # !cancelled() in place of the implicit success(): a rehearsal skips release-please, and a
    # skipped dependency would otherwise skip this job too. A release still needs releases_created,
    # which a failed or skipped release-please never sets.
    if: >-
      !cancelled()
      && (needs.release-please.outputs.releases_created == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Checkout the commit being built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. A release builds the commit release-please released, never github.sha:
          # release-please cuts from main's HEAD, a different commit whenever an unrelated push
          # started the run, and that is how all three 4.1.0 binaries came to report 4.0.0. The sha
          # rather than the tag, because a draft release has no tag ref yet (issue #1145). A
          # rehearsal has no release, so it builds the commit it was dispatched on.
          ref: ${{ needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.release_sha || github.sha }}
          persist-credentials: false

      # No npm cache: what this job builds gets signed, so it starts from nothing an earlier run
      # left behind.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: pwsh
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Verify the checkout is the version being released
        if: needs.release-please.outputs.releases_created == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: |
          $actual = node -p "require('./package.json').version"
          Write-Host "release-please version : $env:RELEASE_VERSION"
          Write-Host "package.json version   : $actual"
          if ($actual -ne $env:RELEASE_VERSION) {
            Write-Host "::error::Refusing to build: package.json says $actual, but the release is $env:RELEASE_VERSION. The binary embeds package.json and would report the wrong version."
            exit 1
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci --include=dev --include=prod

      # scripts/release-win.ps1 builds the binary unsigned, smoke-tests it, checks it carries no
      # signature, and records the digest sign-win64 checks the artifact against.
      - name: Build the unsigned binary
        shell: pwsh
        run: |
          ./scripts/release-win.ps1
          $hash = Get-Content -LiteralPath ./butler-sheet-icons.exe.sha256
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Unsigned Windows binary SHA-256: ``$hash``"

      # 30 days asked for a release, which is as long as GitHub lets a job be re-run: a failed
      # sign-win64 or publish-win64 is recovered with "Re-run failed jobs", which needs this
      # artifact to still exist. The repository's retention setting caps what is asked for (3 days
      # in October 2026; upload-artifact warns and uses the cap), and past it, the fix ships in the
      # next release, since a re-run of build-win64 rebuilds the released commit. A rehearsal needs
      # three days.
      - name: Upload the unsigned binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win64-unsigned
          path: |
            butler-sheet-icons.exe
            butler-sheet-icons.exe.sha256
          retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
          if-no-files-found: error

  sign-win64:
    needs: build-win64
    # Explicit, because the implicit success() fails when anything further up the chain was
    # skipped. A rehearsal skips release-please on purpose, so without this, signing would be
    # skipped while the run still went green - a rehearsal that proved everything except signing.
    if: ${{ !cancelled() && needs.build-win64.result == 'success' }}
    # INVARIANT: no actions/checkout, no npm and no ./scripts in this job. A compromised dependency
    # must not be able to reach the OIDC token; a step that needs repository content belongs in
    # build-win64 or publish-win64.
    runs-on: windows-latest
    timeout-minutes: 15
    # This line is what binds the OIDC subject, and the subject is not the obvious string. With the
    # immutable subject switched on, GitHub presents the owner and repository ids:
    #
    #   repo:ptarmiganlabs@6304190/butler-sheet-icons@381155354:environment:release-signing
    #
    # The Azure app must carry a federated credential matching that exactly, or the login fails with
    # AADSTS700213, "no matching federated identity record found for presented assertion subject".
    # Regenerate the string rather than retyping it, then append ":environment:release-signing":
    #
    #   gh api repos/ptarmiganlabs/butler-sheet-icons/actions/oidc/customization/sub --jq .sub_claim_prefix
    environment: release-signing
    permissions:
      id-token: write # the OIDC token azure/login exchanges for the signing credential
      contents: read # nothing is checked out; downloading this run's artifact needs no more
    outputs:
      # The SHA-256 of the executable the verify step found signed. publish-win64 checks the
      # executable in the zip it attaches against this.
      signed_sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Download the unsigned binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-unsigned
          path: to-sign

      # Belt and braces. GitHub already integrity-protects artifacts, so this cannot currently fail,
      # but it states what the job assumes, and it would catch a future change that re-uploads or
      # rebuilds between build and sign.
      - name: Verify the artifact is what build-win64 produced
        shell: pwsh
        run: |
          $expected = (Get-Content to-sign/butler-sheet-icons.exe.sha256 -Raw).Trim()
          $actual = (Get-FileHash to-sign/butler-sheet-icons.exe -Algorithm SHA256).Hash
          Write-Host "built  : $expected"
          Write-Host "to sign: $actual"
          if ($actual -ne $expected) {
            throw "Refusing to sign: the artifact does not match the digest build-win64 recorded."
          }
          Remove-Item to-sign/butler-sheet-icons.exe.sha256

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\to-sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A hard failure, deliberately: if signing fails, the release fails, rather than quietly
      # shipping something unsigned. Two readings of the same signature - signtool's chain and
      # timestamp check, and the one Windows itself makes - and the signer pinned to Ptarmigan Labs
      # AB, so variables pointed at another certificate profile fail here rather than shipping a
      # binary somebody else signed. The executable's hash, taken once all of that has held, becomes
      # the job's output, which nothing after this job can change.
      - name: Verify the signature
        id: verify
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe not found on this runner." }
          & $st.FullName verify /pa /v to-sign\butler-sheet-icons.exe
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed." }
          $sig = Get-AuthenticodeSignature -LiteralPath to-sign\butler-sheet-icons.exe
          if ($sig.Status -ne 'Valid') { throw "Windows reads the signature as $($sig.Status): $($sig.StatusMessage)" }
          $signer = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signer -cne 'Ptarmigan Labs AB') {
            throw "Signed by an unexpected certificate: '$signer' ($($sig.SignerCertificate.Subject))"
          }
          $hash = (Get-FileHash -LiteralPath to-sign\butler-sheet-icons.exe -Algorithm SHA256).Hash
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "Signed by: ``$($sig.SignerCertificate.Subject)``",
            "Timestamped by: ``$($sig.TimeStamperCertificate.Subject)``",
            "Signed Windows binary SHA-256: ``$hash``"
          )

      - name: Upload the signed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win64-signed
          path: to-sign/butler-sheet-icons.exe
          retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
          if-no-files-found: error

  publish-win64:
    needs:
      - release-please
      - sign-win64
    # Never on a rehearsal, which has no release to attach to. Written out in full for the reason on
    # sign-win64: it depends on exactly these, and no skipped job further up should get a say.
    if: >-
      !cancelled()
      && needs.release-please.outputs.releases_created == 'true'
      && needs.sign-win64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-signed
          path: package

      # The same asset as before the signing moved: <tag>-win.zip, holding butler-sheet-icons.exe
      # and nothing else. And the executable in it is the one sign-win64 found signed, byte for
      # byte, read back out of the finished zip, so nothing between the two jobs can swap it.
      - name: Zip it, and check it holds the binary sign-win64 verified
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag_name }}
          SIGNED_SHA256: ${{ needs.sign-win64.outputs.signed_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNED_SHA256" ]; then
            echo "::error::sign-win64 recorded no hash of the executable it verified. Refusing to publish."
            exit 1
          fi
          test -f package/butler-sheet-icons.exe || { echo "::error::butler-sheet-icons.exe is missing from what sign-win64 produced"; exit 1; }
          ZIP="${RELEASE_TAG}-win.zip"
          (cd package && zip -9 "../$ZIP" butler-sheet-icons.exe)
          unzip -l "$ZIP"
          ZIPPED=$(unzip -p "$ZIP" butler-sheet-icons.exe | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          if [ "$ZIPPED" != "$SIGNED_SHA256" ]; then
            echo "::error::The butler-sheet-icons.exe in $ZIP is not the executable sign-win64 verified ($SIGNED_SHA256 signed, $ZIPPED zipped). Refusing to publish."
            exit 1
          fi
          echo "The butler-sheet-icons.exe in $ZIP is the one sign-win64 verified: $ZIPPED"

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-win.zip
          token: ${{ github.token }}

  release-linux:
    needs: release-please
    runs-on: ubuntu-latest
    # timeout-minutes: 15

    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    env:
      DIST_FILE_NAME: butler-sheet-icons
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Release tag and upload url from previous job
        run: |
          echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
          echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. Without `ref`, checkout takes `github.sha` - the commit that triggered
          # this run - and release-please cuts the release from main's HEAD, which is a
          # different commit whenever an unrelated push is what started the run. On 2026-08-10
          # that shipped all three 4.1.0 binaries built from the commit before the version bump,
          # so they reported "App version: 4.0.0": the SEA build embeds package.json as an asset
          # and globals.js reads the version straight out of it.
          #
          # The sha rather than the tag, because release-please is configured to cut a *draft*
          # release and a draft has no tag ref - GitHub creates it at publication. Checking out
          # the tag name failed all four release jobs on 5.0.0. Issue #1145.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runs after setup-node so `node` is certain to be on PATH, and before the install and
      # build so a mismatch costs seconds rather than a signed, notarized artifact.
      - name: Verify the checkout is the version being released
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.release_version }}"
          actual=$(node -p "require('./package.json').version")
          echo "release-please version : $expected"
          echo "package.json version   : $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build: package.json says $actual, but the release is $expected. The binary embeds package.json and would report the wrong version."
            exit 1
          fi

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          pwd 
          npm ci --include=dev --include=prod

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_tag_name }}
        run: bash ./scripts/release-linux.sh

      - name: Compress release binary
        run: |
          zip -9 -r ./${{ needs.release-please.outputs.release_tag_name }}-linux.zip ${DIST_FILE_NAME}

      - name: Debug
        run: |
          ls -la

      - name: Upload to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          draft: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./${{ needs.release-please.outputs.release_tag_name }}-linux.zip
          token: ${{ github.token }}

      - name: Tidy up before existing
        run: |
          pwd
          ls -la
