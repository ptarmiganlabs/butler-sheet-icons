name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  unit-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------------------------
  # Browser suites - no Qlik back end at all.
  #
  # The five browser integration tests read only BSI_LOG_LEVEL and BSI_TEST_TIMEOUT, so these jobs
  # carry no concurrency group and no ordering constraint. The macOS half runs on a hosted runner;
  # the Windows half stays on-premise purely to keep Windows platform coverage.
  # ---------------------------------------------------------------------------------------------
  test-browser-macos:
    needs:
      - unit-tests
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run browser tests
        run: npm run test:integration:browser
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}

  test-browser-win:
    needs:
      - unit-tests
    permissions:
      contents: read
    # No win-code-sign: these jobs sign nothing, and requiring it would pin them to the one
    # runner that holds the signing certificate. Without it they pool across every Windows runner.
    runs-on:
      - self-hosted
      - x64
      - windows
      - sp53
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --include=dev --include=prod

      - name: Run browser tests
        shell: powershell
        run: npm run test:integration:browser
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}

  # ---------------------------------------------------------------------------------------------
  # QS Cloud chain - every job here talks to the shared Qlik Sense Cloud tenant.
  #
  # None of it needs the on-premise environment, so all four run on hosted runners.
  # ---------------------------------------------------------------------------------------------
  test-qscloud-macos:
    needs:
      - unit-tests
    permissions:
      contents: read
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run QS cloud tests
        run: npm run test:integration:cloud
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}
          BSI_INCLUDE_SHEET_PART: ${{ secrets.BSI_INCLUDE_SHEET_PART }}
          BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
          BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
          BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
          BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
          BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
          BSI_CLOUD_COLLECTION_ID: ${{ secrets.BSI_CLOUD_COLLECTION_ID }}

  test-qscloud-win:
    # Chained rather than parallel: this is what keeps only one job at a time against the tenant
    # *within* a run. The concurrency group guards against other runs.
    needs:
      - test-qscloud-macos
    permissions:
      contents: read
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
    # No win-code-sign: these jobs sign nothing, and requiring it would pin them to the one
    # runner that holds the signing certificate. Without it they pool across every Windows runner.
    runs-on:
      - self-hosted
      - x64
      - windows
      - sp53
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --include=dev --include=prod

      - name: Run QS cloud tests
        shell: powershell
        run: npm run test:integration:cloud
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}
          BSI_INCLUDE_SHEET_PART: ${{ secrets.BSI_INCLUDE_SHEET_PART }}
          BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
          BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
          BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
          BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
          BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
          BSI_CLOUD_COLLECTION_ID: ${{ secrets.BSI_CLOUD_COLLECTION_ID }}

  # ---------------------------------------------------------------------------------------------
  # QSEoW chain - every job here talks to the on-premise Qlik Sense environment, which is not
  # reachable from the internet. All four are therefore self-hosted, and none of them may share a
  # job with QS Cloud work.
  # ---------------------------------------------------------------------------------------------
  test-qseow-macos:
    needs:
      - unit-tests
    permissions:
      contents: read
    concurrency:
      group: bsi-qseow-${{ github.repository }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macos
      - arm64
      - mac-build2
      - sp53
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Prepare QSEoW cert files
        env:
          QS_CLIENT_PEM: ${{ secrets.PRO2WIN1_QS_CLIENT_PEM }}
          QS_CLIENT_KEY_PEM: ${{ secrets.PRO2WIN1_QS_CLIENT_KEY_PEM }}
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/bsi-cert"
          mkdir -p "$CERT_DIR"
          if [ -z "${QS_CLIENT_PEM:-}" ] || [ -z "${QS_CLIENT_KEY_PEM:-}" ]; then
            echo 'Missing QSEoW client certificate secrets' >&2
            exit 1
          fi
          CERT_FILE="$CERT_DIR/client.pem"
          KEY_FILE="$CERT_DIR/client_key.pem"
          printf '%s\n' "$QS_CLIENT_PEM" > "$CERT_FILE"
          printf '%s\n' "$QS_CLIENT_KEY_PEM" > "$KEY_FILE"
          chmod 600 "$CERT_FILE" "$KEY_FILE"
          {
            echo "BSI_CERT_FILE=$CERT_FILE"
            echo "BSI_CERT_KEY_FILE=$KEY_FILE"
          } >> "$GITHUB_ENV"

      - name: Run QSEoW tests
        run: npm run test:integration:qseow
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_CONTENT_LIBRARY: 'abc 123'
          BSI_HOST: ${{ secrets.BSI_HOST }}
          BSI_PREFIX: ${{ secrets.BSI_PREFIX }}
          BSI_APP_ID: 'a3e0f5d2-000a-464f-998d-33d333b175d7'
          BSI_LOGON_USER_DIR: ${{ secrets.BSI_LOGON_USER_DIR }}
          BSI_LOGON_USER_ID: ${{ secrets.BSI_LOGON_USER_ID }}
          BSI_LOGON_PWD: ${{ secrets.BSI_LOGON_PWD }}
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}
          BSI_INCLUDE_SHEET_PART: ${{ secrets.BSI_INCLUDE_SHEET_PART }}
          BSI_SENSE_VERSION: ${{ secrets.BSI_SENSE_VERSION }}

  test-qseow-win:
    needs:
      - test-qseow-macos
    permissions:
      contents: read
    concurrency:
      group: bsi-qseow-${{ github.repository }}
      cancel-in-progress: false
    # No win-code-sign: these jobs sign nothing, and requiring it would pin them to the one
    # runner that holds the signing certificate. Without it they pool across every Windows runner.
    runs-on:
      - self-hosted
      - x64
      - windows
      - sp53
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the note on the other jobs: pins npm so the install is identical on every runner.
      - name: Pin npm
        shell: powershell
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --include=dev --include=prod

      # Writes the client certificate into RUNNER_TEMP from secrets, the same way the macOS job
      # does. It previously took BSI_CERT_FILE/BSI_CERT_KEY_FILE from secrets holding *paths* to
      # files pre-installed on one specific machine, which meant this job only worked on that
      # runner. Deriving the files here instead makes any Windows runner interchangeable.
      #
      # .NET file APIs rather than Set-Content/Out-File: Windows PowerShell would write a BOM and
      # CRLF line endings, and a PEM with a BOM is rejected when the certificate is parsed.
      - name: Prepare QSEoW cert files
        shell: powershell
        env:
          QS_CLIENT_PEM: ${{ secrets.PRO2WIN1_QS_CLIENT_PEM }}
          QS_CLIENT_KEY_PEM: ${{ secrets.PRO2WIN1_QS_CLIENT_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:QS_CLIENT_PEM) -or
              [string]::IsNullOrWhiteSpace($env:QS_CLIENT_KEY_PEM)) {
            throw 'Missing QSEoW client certificate secrets'
          }
          $certDir = Join-Path $env:RUNNER_TEMP 'bsi-cert'
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $certFile = Join-Path $certDir 'client.pem'
          $keyFile = Join-Path $certDir 'client_key.pem'
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($certFile, ($env:QS_CLIENT_PEM -replace "`r`n", "`n"), $utf8NoBom)
          [System.IO.File]::WriteAllText($keyFile, ($env:QS_CLIENT_KEY_PEM -replace "`r`n", "`n"), $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "BSI_CERT_FILE=$certFile`nBSI_CERT_KEY_FILE=$keyFile`n", $utf8NoBom)

      # BSI_CERT_FILE and BSI_CERT_KEY_FILE deliberately absent here - they arrive via GITHUB_ENV
      # from the step above. A step-level env entry would take precedence over GITHUB_ENV and
      # silently reinstate the hardcoded paths.
      - name: Run QSEoW tests
        shell: powershell
        run: npm run test:integration:qseow
        env:
          BSI_LOG_LEVEL: 'info'
          BSI_CONTENT_LIBRARY: 'abc 123'
          BSI_HOST: ${{ secrets.BSI_HOST }}
          BSI_PREFIX: ${{ secrets.BSI_PREFIX }}
          BSI_APP_ID: 'a3e0f5d2-000a-464f-998d-33d333b175d7'
          BSI_LOGON_USER_DIR: ${{ secrets.BSI_LOGON_USER_DIR }}
          BSI_LOGON_USER_ID: ${{ secrets.BSI_LOGON_USER_ID }}
          BSI_LOGON_PWD: ${{ secrets.BSI_LOGON_PWD }}
          BSI_TEST_TIMEOUT: ${{ secrets.BSI_TEST_TIMEOUT }}
          BSI_INCLUDE_SHEET_PART: ${{ secrets.BSI_INCLUDE_SHEET_PART }}
          BSI_SENSE_VERSION: ${{ secrets.BSI_SENSE_VERSION }}

  # ---------------------------------------------------------------------------------------------
  # Docker image builds - no Qlik back end, so no group, and they only wait on unit-tests.
  #
  # The image smoke test and the browser-cache commands need no back end either, so they run here
  # where the image is already local, rather than paying an artifact round trip in a later job.
  # ---------------------------------------------------------------------------------------------
  docker-build-arm64:
    name: docker-build-arm64
    needs:
      - unit-tests
    if: github.repository_owner == 'ptarmiganlabs'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    # Builds a linux/arm64 image, so it needs an arm64 host but not the local Qlik Sense
    # environment. A hosted arm64 runner builds natively, rather than going through Docker
    # Desktop on the self-hosted Mac.
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_NAME: butler-sheet-icons:ci-arm64
      IMAGE_TAR: butler-sheet-icons-ci-arm64.tar
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build arm64 Docker image
        run: |
          set -x
          docker build \
            --file src/Dockerfile \
            --tag "$IMAGE_NAME" \
            --platform linux/arm64 \
            --progress=plain \
            . 2>&1 | tee /tmp/docker-build.log || {
              echo "Build failed, showing last 50 lines:"
              tail -50 /tmp/docker-build.log
              exit 1
            }

      - name: Smoke test arm64 image
        run: docker run --rm "$IMAGE_NAME" --version

      - name: Run browser cache commands (arm64 image)
        run: |
          CACHE_DIR="$RUNNER_TEMP/bsi-browser-cache"
          mkdir -p "$CACHE_DIR"
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser list-available
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser uninstall-all

      - name: Save Docker image to tarball
        run: docker save "$IMAGE_NAME" -o "$IMAGE_TAR"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-sheet-icons-ci-arm64-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  docker-build-on-ubuntu-amd64:
    name: docker-build-on-ubuntu-amd64
    needs:
      - unit-tests
    if: github.repository_owner == 'ptarmiganlabs'
    permissions:
      contents: read
      actions: write
    # Image build only - no Qlik Sense access needed, so this does not have to be on-premise.
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: butler-sheet-icons:ci-amd64
      IMAGE_TAR: butler-sheet-icons-ci-amd64.tar
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build amd64 Docker image
        run: |
          docker build \
            --file src/Dockerfile \
            --tag "$IMAGE_NAME" \
            .

      - name: Smoke test amd64 image
        run: docker run --rm "$IMAGE_NAME" --version

      - name: Run browser cache commands (amd64 image)
        run: |
          CACHE_DIR="$RUNNER_TEMP/bsi-browser-cache"
          mkdir -p "$CACHE_DIR"
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser list-available
          docker run --rm \
            -v "$CACHE_DIR:/home/nodejs/.cache/puppeteer" \
            "$IMAGE_NAME" \
            browser uninstall-all

      - name: Save Docker image to tarball
        run: docker save "$IMAGE_NAME" -o "$IMAGE_TAR"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-sheet-icons-ci-amd64-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # Docker image exercised against each back end. Split the same way as the test jobs, and for the
  # same reason: a job may carry only one concurrency group.
  # ---------------------------------------------------------------------------------------------
  docker-qscloud-arm64:
    needs:
      - docker-build-arm64
      - test-qscloud-win
    if: github.repository_owner == 'ptarmiganlabs'
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_NAME: butler-sheet-icons:ci-arm64
      IMAGE_TAR: butler-sheet-icons-ci-arm64.tar
      BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
      BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
      BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
      BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
      BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: butler-sheet-icons-ci-arm64-image

      - name: Load Docker image
        run: docker load --input "$IMAGE_TAR"

      - name: Run QS Cloud commands (arm64 image)
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          docker run --rm \
            "$IMAGE_NAME" \
            qscloud list-collections \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --outputformat table

          docker run --rm \
            -v "$IMG_DIR:/nodeapp/img" \
            "$IMAGE_NAME" \
            qscloud create-sheet-thumbnails \
            --tenanturl "$BSI_CLOUD_TENANT_URL" \
            --apikey "$BSI_CLOUD_API_KEY" \
            --logonuserid "$BSI_CLOUD_LOGON_USERID" \
            --logonpwd "$BSI_CLOUD_LOGON_PWD" \
            --appid "$BSI_CLOUD_APP_ID" \
            --log-level verbose \
            --imagedir ./img

  docker-qscloud-amd64:
    needs:
      - docker-build-on-ubuntu-amd64
      - docker-qscloud-arm64
    if: github.repository_owner == 'ptarmiganlabs'
    concurrency:
      group: bsi-qscloud-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: butler-sheet-icons:ci-amd64
      IMAGE_TAR: butler-sheet-icons-ci-amd64.tar
      BSI_CLOUD_TENANT_URL: ${{ secrets.BSI_CLOUD_TENANT_URL }}
      BSI_CLOUD_API_KEY: ${{ secrets.BSI_CLOUD_API_KEY }}
      BSI_CLOUD_LOGON_USERID: ${{ secrets.BSI_CLOUD_LOGON_USERID }}
      BSI_CLOUD_LOGON_PWD: ${{ secrets.BSI_CLOUD_LOGON_PWD }}
      BSI_CLOUD_APP_ID: ${{ secrets.BSI_CLOUD_APP_ID }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: butler-sheet-icons-ci-amd64-image

      - name: Load Docker image
        run: docker load --input "$IMAGE_TAR"

      - name: Run QS Cloud commands (amd64 image)
        run: |
          IMG_DIR="$RUNNER_TEMP/bsi-img"
          mkdir -p "$IMG_DIR"
          docker run --rm \
            "$IMAGE_NAME" \
            qscloud list-collections \
