name: insiders-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  insiders-build:
    permissions:
      contents: read
      actions: write
      security-events: write
    # The jest scripts no longer pass --forceExit (issue #951), so a unit suite that genuinely
    # leaks a handle now hangs instead of exiting, and without a timeout it would run to GitHub's
    # 6-hour default. 20 minutes is roughly 3x the slowest observed run of this job (6m34s, on win).
    timeout-minutes: 20
    strategy:
      matrix:
        target: [win, linux]
        include:
          # Both GitHub-hosted: this repository is public, and no self-hosted runner group admits
          # a public repository (plabs-house-rules, rules/ci/public-repositories.md). The Windows
          # build is unsigned, as every insiders build is; see scripts/insider-build-win.ps1.
          - target: win
            runs_on:
              - windows-latest
            artifact_insider: butler-sheet-icons--win-x64--${{ github.sha }}.zip
          - target: linux
            runs_on:
              - ubuntu-latest
            artifact_insider: butler-sheet-icons--linux-x64--${{ github.sha }}.tgz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: |
          pwd
          npm ci --include=dev --include=prod

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Snyk to check for vulnerabilities
        if: |
          github.repository_owner == 'ptarmiganlabs' &&
          matrix.target == 'linux'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=./package.json --sarif-file-output=snyk.sarif

      - name: Upload Snyk result to GitHub Code Scanning
        continue-on-error: true
        if: |
          github.repository_owner == 'ptarmiganlabs' &&
          matrix.target == 'linux'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: snyk.sarif

      - name: Create binaries (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        env:
          DIST_FILE_NAME: butler-sheet-icons
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: ./scripts/insider-build-win.ps1

      - name: Create binaries (Linux)
        if: matrix.target == 'linux'
        env:
          DIST_FILE_NAME: butler-sheet-icons
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: bash ./scripts/insider-build-linux.sh

      - name: Generate SBOM (linux only)
        if: matrix.target == 'linux'
        env:
          DIST_FILE_NAME: butler-sheet-icons
          SBOM_TOOL_VERSION: v4.0.2
        run: |
          curl -Lo $RUNNER_TEMP/sbom-tool "https://github.com/microsoft/sbom-tool/releases/download/${SBOM_TOOL_VERSION}/sbom-tool-linux-x64"
          chmod +x $RUNNER_TEMP/sbom-tool

          mkdir -p ./build/sbom
          VERSION=$(node -p "require('./package.json').version")
          $RUNNER_TEMP/sbom-tool generate \
            -b ./build/sbom \
            -bc . \
            -pn ${DIST_FILE_NAME} \
            -pv ${VERSION} \
            -ps "Ptarmigan Labs" \
            -nsb https://sbom.ptarmiganlabs.com \
            -V verbose

      - name: Upload SBOM artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-insiders-${{ github.sha }}
          path: ./build/sbom/
          retention-days: 7

      - name: Upload insider build artifacts to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_insider }}
          path: ${{ matrix.artifact_insider }}
          retention-days: 7

  # macOS is a job of its own so that it alone runs in the release-signing environment, which
  # admits main alone. It is the only insiders build that is signed, and notarised, so it is the only
  # one that needs the Apple secrets; the Windows and Linux legs have no reason to be in the
  # environment. Why the environment matters: see release-macos-arm64 in ci.yaml. butler-sos builds
  # its macOS insiders the same way.
  #
  # A workflow_dispatch from any other branch is refused at this job, because the environment admits
  # only main; the Windows and Linux legs still run.
  insiders-build-macos:
    permissions:
      contents: read
    # The 20 minutes of the matrix above, plus room for notarisation, which waits on Apple and
    # usually takes a few minutes but has no upper bound of its own.
    timeout-minutes: 30
    # GitHub-hosted, for the reason on the matrix above. Pinned rather than macos-latest because the
    # binary must be arm64: macOS binaries are arm64 only.
    runs-on: macos-15
    environment: release-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ''

      # See the same step in the matrix above.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Create binaries (macOS)
        env:
          DIST_FILE_NAME: butler-sheet-icons
          GITHUB_TOKEN: ${{ secrets.PAT }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: bash ./scripts/insider-build-mac.sh

      # The signed binary, run beside the source before it is uploaded, so that a hardened runtime
      # or an entitlement that stops it starting fails here rather than in somebody's download. It
      # runs the binary, which carries dependency code, and holds no secret: those are on the step
      # above alone.
      - name: Test the signed binary
        run: npm run test:binary
        env:
          BSI_BINARY: butler-sheet-icons
          REQUIRE_BINARY: '1'

      - name: Upload insider build artifacts to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: butler-sheet-icons--macos-arm64--${{ github.sha }}.zip
          path: butler-sheet-icons--macos-arm64--${{ github.sha }}.zip
          retention-days: 7
