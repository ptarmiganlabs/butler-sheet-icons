name: SonarCloud analysis with coverage

# CI-based analysis, which exists for one reason: SonarCloud's Automatic Analysis cannot
# import coverage reports. While the project runs on Automatic Analysis, any coverage-based
# quality-gate condition evaluates to 0.0% no matter what the code contains.
#
# TWO MANUAL STEPS ARE REQUIRED before this does anything:
#
#   1. Add a repository secret named SONAR_TOKEN, generated at
#      https://sonarcloud.io/account/security. Until it exists the scan step below is
#      skipped, so this workflow is inert rather than red.
#   2. Turn OFF Automatic Analysis in the SonarCloud project
#      (Administration -> Analysis Method). The two modes are mutually exclusive; leaving
#      both on makes the scanner fail with "You are running CI analysis while Automatic
#      Analysis is enabled".
#
# Coverage is produced by `npm run test:unit`, not `npm test`. The integration suites need a
# live Qlik Sense environment and credentials, so they cannot run here.
#
# Note this workflow runs on pull_request, unlike ci.yaml, which only runs on push to main.
# Sonar's "New Code" measurements are pull-request-scoped, so PR runs are the point.

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Analyse with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'ptarmiganlabs'
    permissions:
      contents: read
    env:
      # Only a boolean at job scope, never the token itself. A job-level secret is in the
      # environment of every step, including the test run — which executes test code from the
      # pull request, and same-repository PRs do receive secrets. That would let a PR read the
      # token straight out of process.env. The `secrets` context is not available in a
      # step-level `if:`, which is why the condition needs an env var at all; this way the
      # thing exposed to the test run is "true"/"false" rather than a credential.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: SonarCloud scan
        # Skipped rather than failed when the secret is absent, so this workflow stays green
        # until step 1 above is done, and on pull requests from forks, which get no secrets.
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
