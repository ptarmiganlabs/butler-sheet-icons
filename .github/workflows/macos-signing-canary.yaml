name: macos-signing-canary

# Manually-run smoke test for the macOS release path.
#
# release-macos-arm64 in ci.yaml only runs when release-please actually cuts a release, so the
# signing and notarization path is otherwise exercised for the first time during a live release.
# This job runs the very same scripts, in the same two steps, on the very same runner image, but
# stops short of publishing: nothing is uploaded to a release and no tag is touched.
#
# Run it after changing scripts/release-macos.sh, scripts/sign-macos.sh,
# scripts/lib/macos-signing-keychain.sh or release-config/apple-ca/, or after changing the runner
# image in release-macos-arm64. It also runs weekly on its own, which is what catches GitHub
# retiring the pinned macOS image - or the Developer ID certificate reaching expiry, or the
# notarization app-specific password being revoked - before a release does.
#
# It runs on the hosted runner the release uses. It used to run on the self-hosted build Mac as
# well, with a watchdog for the keychain bug that only a logged-in desktop shows: the signing script
# once made its throwaway keychain the user's *default* keychain for the length of every build,
# which made Google Drive ask the person at that Mac for a password it could not know. This
# repository is public, and no self-hosted runner group admits a public repository
# (plabs-house-rules, rules/ci/public-repositories.md), so that leg could never start again and was
# removed in October 2026, along with the insiders build that signed on that Mac. Every macOS
# signing in this repository now happens on an ephemeral hosted runner, where that bug cannot
# reach a person. The watchdog is in this file's history.

on:
  schedule:
    # Sundays 04:30 UTC. An hour before windows-signing-canary at 05:30 so the two never overlap:
    # notarization waits on Apple's service and this job is bounded at 30 minutes. Both run ahead of
    # the homelab runner canaries at 06:30, so a signing failure arrives in its own slot.
    #
    # Weekly for the same reason as the Windows canary: nothing here degrades on a clock, so a daily
    # run would spend seven times the notarization requests for no extra warning. Every failure mode
    # is an external event - a retired runner image, an expired certificate, a revoked password.
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  sign-and-notarize:
    # MUST stay in sync with release-macos-arm64 in ci.yaml - proving that image is the point.
    runs-on: macos-15
    # 30 rather than a tight multiple of the 1-minute observed run because notarytool waits on
    # Apple's notary service, whose latency is not ours to predict.
    timeout-minutes: 30
    # The environment release-macos-arm64 uses, which admits only main: the Apple secrets are to
    # move into it, and this job must still find them when they do. Dispatch it on main.
    environment: release-signing
    permissions:
      contents: read
    # No secret at job level, as in release-macos-arm64: the Apple secrets are on the signing step.
    env:
      DIST_FILE_NAME: butler-sheet-icons
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in release-macos-arm64: before any dependency runs, so that the signing step can refuse
      # a kit that npm ci's install scripts rewrote.
      - name: Record the signing kit before any dependency runs
        id: kit
        run: |
          digest=$(/usr/bin/shasum -a 256 scripts/sign-macos.sh scripts/lib/macos-signing-keychain.sh \
                       release-config/butler-sheet-icons.entitlements release-config/apple-ca/*.cer \
                   | /usr/bin/shasum -a 256 | /usr/bin/cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "signing kit: $digest"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ''
      # The npm bundled with Node 24 is 11.x, and 11.x resolves this lockfile differently between
      # patch releases - a second Windows runner picking up a newer Node installed 53 fewer
      # packages and could not resolve jest-circus. Pinning npm here makes the install identical
      # on every runner, hosted or self-hosted, regardless of machine state. npm 12 is also what
      # honours min-release-age in .npmrc.
      - name: Pin npm
        # zizmor: ignore[adhoc-packages] - setup-node has no npm-version input, so npm 12
        # cannot arrive any other way. Pinned to an exact version rather than a range.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@12.0.2
          npm --version

      - name: Report host details
        run: |
          sw_vers
          echo "arch          : $(uname -m)"
          echo "bash          : ${BASH_VERSION:-unknown} at $(command -v bash)"
          echo "node          : $(node --version) at $(command -v node)"

      # A build must start from a healthy host. If a previous run left a signing keychain behind,
      # that is worth knowing before this run's cleanup silently absorbs it - the whole class of
      # bug is about state surviving between builds.
      - name: Audit the keychain before signing
        run: bash scripts/diag/macos-keychain-check.sh

      - name: Record the keychain state before signing
        run: |
          set -euo pipefail
          {
            echo '--- search list ---'
            security list-keychains -d user
            echo '--- default keychain ---'
            security default-keychain -d user
          } | tee "$RUNNER_TEMP/keychains-before.txt"

      - name: Install dependencies
        run: npm ci --include=dev --include=prod

      - name: Build the binary
        run: bash ./scripts/release-macos.sh

      # The signing step of release-macos-arm64, which says why it runs as it does. Change the three
      # signing steps together. The zip is named as a release's is, with the run in place of the tag.
      - name: Sign with the Developer ID and notarize
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          ZIP: ./canary-${{ github.run_id }}-macos-arm64.zip
          KIT_SHA256: ${{ steps.kit.outputs.sha256 }}
          SIGNING_TEMP: ${{ runner.temp }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          IFS=$' \t\n'
          keep=" ZIP KIT_SHA256 SIGNING_TEMP MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_CERTIFICATE_NAME PROD_MACOS_NOTARIZATION_APPLE_ID PROD_MACOS_NOTARIZATION_TEAM_ID PROD_MACOS_NOTARIZATION_PWD "
          for name in $(compgen -e); do
            case "$keep" in *" $name "*) ;; *) unset "$name" 2>/dev/null || true ;; esac
          done
          for name in $(compgen -e); do
            case "$keep" in *" $name "*) ;; *) echo "::error::$name could not be cleared from the environment. Refusing to sign."; exit 1 ;; esac
          done
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export RUNNER_TEMP="$SIGNING_TEMP" TMPDIR="$SIGNING_TEMP"
          USER=$(id -un); LOGNAME="$USER"; export USER LOGNAME
          HOME=$(dscl . -read "/Users/$USER" NFSHomeDirectory | awk '{print $2}'); export HOME

          actual=$(shasum -a 256 scripts/sign-macos.sh scripts/lib/macos-signing-keychain.sh \
                       release-config/butler-sheet-icons.entitlements release-config/apple-ca/*.cer \
                   | shasum -a 256 | cut -d ' ' -f 1)
          if [ "$actual" != "$KIT_SHA256" ]; then
            echo "::error::The signing kit changed after the checkout ($KIT_SHA256 then, $actual now). Refusing to sign."
            exit 1
          fi

          exec /bin/bash --noprofile --norc -p ./scripts/sign-macos.sh ./butler-sheet-icons "$ZIP"

      # codesign -dv writes to stderr, hence the redirect. Assert the two properties that actually
      # matter and that a wrong signing identity would silently get wrong: the Developer ID
      # authority, and the hardened runtime that notarization requires.
      - name: Verify the signature
        run: |
          set -euo pipefail
          codesign -dv --verbose=4 "./${DIST_FILE_NAME}" 2> codesign-info.txt
          cat codesign-info.txt

          if ! grep -q 'Authority=Developer ID Application' codesign-info.txt; then
            echo "::error::binary is not signed with a Developer ID Application certificate"
            exit 1
          fi

          if ! grep -q 'flags=.*runtime' codesign-info.txt; then
            echo "::error::hardened runtime is not enabled - notarization would be rejected"
            exit 1
          fi

          # --deep is for bundles; this is a bare Mach-O executable.
          codesign --verify --strict --verbose=2 "./${DIST_FILE_NAME}"

          echo "Signature OK. The signing step above refuses anything but an Accepted notarization,"
          echo "and printed Apple's log for the submission."

      # The same test as the release job's, on the binary this run signed. It holds no secret, as
      # there: those are on the signing step alone.
      - name: Test the signed binary
        run: npm run test:binary
        env:
          BSI_BINARY: ./butler-sheet-icons
          REQUIRE_BINARY: '1'

      # Unconditional: a failed or cancelled signing run is exactly the case where the keychain is
      # most likely to have been left behind, so that is when the assertion matters most.
      - name: Assert the keychain state was restored
        if: always()
        run: |
          set -euo pipefail
          {
            echo '--- search list ---'
            security list-keychains -d user
            echo '--- default keychain ---'
            security default-keychain -d user
          } > "$RUNNER_TEMP/keychains-after.txt"

          if ! diff -u "$RUNNER_TEMP/keychains-before.txt" "$RUNNER_TEMP/keychains-after.txt"; then
            echo '::error::the keychain configuration was not restored to what it was before the build'
            exit 1
          fi

          bash scripts/diag/macos-keychain-check.sh
          echo 'Keychain configuration restored exactly.'

      - name: Upload the signed archive for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signing-canary-${{ github.run_id }}
          path: ./*-macos-arm64.zip
          retention-days: 3
